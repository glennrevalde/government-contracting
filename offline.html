<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<meta name="robots" content="noindex">
<title>No internet connection</title>
<style>
  /* shown by sw.js when a page cannot be reached; everything it needs is in this file */
  :root { --page: #f5f6f8; --ink: #212529; --soft: #5c636a; --line: #dfe3e9; --blue: #0d6efd; --blue-deep: #0b5ed7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--page); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 420px; padding: 32px 28px 28px; text-align: center; background: #fff;
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 0 #fff inset, 0 2px 4px rgba(15, 23, 42, .06), 0 22px 40px -22px rgba(15, 23, 42, .35);
  }
  .tile {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, #3d8bfd, #0b5ed7);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 -2px 0 rgba(0, 0, 0, .18) inset, 0 8px 18px -6px rgba(11, 94, 215, .55);
  }
  h1 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 750; letter-spacing: -.01em; }
  p { margin: 0 0 22px; color: var(--soft); font-size: .95rem; line-height: 1.5; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 160px; min-height: 44px; padding: 10px 22px;
    font: inherit; font-weight: 650; color: #fff; cursor: pointer; border: 1px solid #0a58ca; border-radius: 10px;
    background: linear-gradient(180deg, #3d8bfd, #0d6efd 55%, #0b5ed7);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 2px 4px rgba(11, 94, 215, .35);
  }
  button:hover { background: linear-gradient(180deg, #2f7ff7, #0b5ed7); }
  button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(11, 94, 215, .35) inset; }
  button:focus-visible { outline: 3px solid rgba(13, 110, 253, .4); outline-offset: 2px; }
  button[disabled] { opacity: .7; cursor: progress; }
  .note { margin: 16px 0 0; font-size: .82rem; color: #6c757d; }
</style>
</head>
<body>
<main class="card" role="main">
  <div class="tile" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 14 0"/><path d="M8.5 16.3a5 5 0 0 1 7 0"/>
      <circle cx="12" cy="19.6" r="1.1" fill="currentColor" stroke="none"/><path d="M3.5 3.5l17 17"/>
    </svg>
  </div>
  <h1>No internet connection</h1>
  <p>The system cannot reach the server right now. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" id="retry">Try again</button>
  <p class="note">The page opens by itself as soon as the connection is back.</p>
</main>
<script>
  (function () {
    var btn = document.getElementById('retry');
    function retry() { btn.disabled = true; btn.textContent = 'Connecting...'; location.reload(); }
    btn.addEventListener('click', retry);
    window.addEventListener('online', retry);
  })();
</script>
</body>
</html>
